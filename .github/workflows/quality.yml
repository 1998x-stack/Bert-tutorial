name: Course quality gates

on:
  push:
    branches: [main, "olah-style/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser test dependency
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run catalog and content tests
        run: npm test

      - name: Run reference implementation unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run HTTP and file:// browser checks
        run: npm run test:browser

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bert-tutorial-browser-qa
          path: artifacts/browser-qa/
          if-no-files-found: ignore
