<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">AdaLoRA秩预算分配与LoRA推理前合并</title><desc id="d">左侧三个目标矩阵固定rank分配为4 4 4，AdaLoRA重要性示意分为2 8 2；右侧训练有W0和BA两路径，合并后Wmerged是一个密集矩阵，没有额外低秩推理算子。</desc><rect width="960" height="450" rx="20" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" fill="#203035"><text x="25" y="44" font-size="23" font-weight="700">训练预算分配 ≠ 线上推理矩阵大小</text><rect x="24" y="75" width="476" height="337" rx="15" fill="#fff" stroke="#dce5df"/><text x="44" y="108" font-size="18" font-weight="700">三个模块，总 rank=12</text><text x="45" y="158" font-size="17" fill="#203035">固定 LoRA</text><rect x="45" y="182" width="133" height="68" rx="10" fill="#edf0ed"/><rect x="45" y="182" width="66.5" height="68" rx="10" fill="#147f80"/><text x="111" y="221" text-anchor="middle" fill="#203035" font-size="16">Q: 4</text><rect x="193" y="182" width="133" height="68" rx="10" fill="#edf0ed"/><rect x="193" y="182" width="66.5" height="68" rx="10" fill="#7461ba"/><text x="259" y="221" text-anchor="middle" fill="#203035" font-size="16">V: 4</text><rect x="341" y="182" width="133" height="68" rx="10" fill="#edf0ed"/><rect x="341" y="182" width="66.5" height="68" rx="10" fill="#147f80"/><text x="407" y="221" text-anchor="middle" fill="#203035" font-size="16">FFN: 4</text><text x="45" y="278" font-size="17" fill="#203035">AdaLoRA 示意</text><rect x="45" y="302" width="133" height="68" rx="10" fill="#edf0ed"/><rect x="45" y="302" width="33.25" height="68" rx="10" fill="#147f80"/><text x="111" y="341" text-anchor="middle" fill="#203035" font-size="16">Q: 2</text><rect x="193" y="302" width="133" height="68" rx="10" fill="#edf0ed"/><rect x="193" y="302" width="133" height="68" rx="10" fill="#7461ba"/><text x="259" y="341" text-anchor="middle" fill="#203035" font-size="16">V: 8</text><rect x="341" y="302" width="133" height="68" rx="10" fill="#edf0ed"/><rect x="341" y="302" width="33.25" height="68" rx="10" fill="#147f80"/><text x="407" y="341" text-anchor="middle" fill="#203035" font-size="16">FFN: 2</text><rect x="524" y="75" width="411" height="337" rx="15" fill="#fff" stroke="#dce5df"/><text x="545" y="108" font-size="19" font-weight="700">LoRA 可在推理前合并</text><rect x="551" y="138" width="171" height="72" rx="10" fill="#dce5df"/><text x="636" y="178" text-anchor="middle" font-size="18">W₀ (dense)</text><text x="737" y="181" font-size="25">+</text><rect x="767" y="138" width="137" height="72" rx="10" fill="#e2f0eb"/><text x="835" y="178" text-anchor="middle" font-size="18">BA (rank r)</text><path d="M733 221 V256 H734" stroke="#147f80" stroke-width="3"/><rect x="551" y="257" width="353" height="78" rx="12" fill="#203035"/><text x="727" y="290" text-anchor="middle" fill="#fff" font-size="18">Wmerged = W₀ + (α/r)BA</text><text x="727" y="317" text-anchor="middle" fill="#dce8e3" font-size="14">依旧是一块完整 dense 矩阵</text><text x="727" y="382" text-anchor="middle" font-size="14" fill="#53676d">无额外 adapter matmul，但并非压缩 dense 参数</text></g></svg>