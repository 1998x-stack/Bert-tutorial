<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 455" role="img" aria-labelledby="title desc"><title id="title">DeBERTa 三项解耦注意力分数</title><desc id="desc">Query i 与 Key j 由内容到内容、内容到相对位置、反向相对位置到内容三个独立投影点积得分。三项加和后用三倍头维度的平方根缩放，并沿 key 位置 softmax，权重加权内容 value。</desc><rect width="960" height="455" rx="22" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="36" font-size="22" fill="#203035" font-weight="700">同一对 token (i, j)：三条评分路径</text><text x="480" y="63" font-size="14" fill="#53676d">目标 i 的 query，候选 j 的 key；相对方向要反过来读</text>
<rect x="25" y="97" width="287" height="140" rx="18" fill="#e2f2ec" stroke="#15847a" stroke-width="2"/><rect x="336" y="97" width="288" height="140" rx="18" fill="#f0eafb" stroke="#7863b1" stroke-width="2"/><rect x="648" y="97" width="287" height="140" rx="18" fill="#fff0df" stroke="#c98545" stroke-width="2"/>
<text x="168" y="130" font-size="19" fill="#175b55" font-weight="700">C → C</text><text x="168" y="162" font-size="17" fill="#175b55">Qᶜᵢ · Kᶜⱼ</text><text x="168" y="191" font-size="14" fill="#175b55">词内容与词内容</text><text x="168" y="213" font-size="13" fill="#53676d">谁和谁相关</text>
<text x="480" y="130" font-size="19" fill="#61469c" font-weight="700">C → P</text><text x="480" y="162" font-size="17" fill="#61469c">Qᶜᵢ · Kʳδ(i,j)</text><text x="480" y="191" font-size="14" fill="#61469c">词内容与相对位置</text><text x="480" y="213" font-size="13" fill="#53676d">正向 δ(i,j)</text>
<text x="791" y="130" font-size="19" fill="#a85c31" font-weight="700">P → C</text><text x="791" y="162" font-size="17" fill="#a85c31">Kᶜⱼ · Qʳδ(j,i)</text><text x="791" y="191" font-size="14" fill="#a85c31">反向相对位置与词内容</text><text x="791" y="213" font-size="13" fill="#53676d">反向 δ(j,i)</text>
<path d="M168 238 V263 H480 V289 M480 238 V289 M791 238 V263 H480 V289" stroke="#168579" stroke-width="2.5" fill="none"/>
<rect x="235" y="289" width="490" height="72" rx="16" fill="#203035"/><text x="480" y="316" fill="#fff" font-size="19" font-weight="700">logits 求和 → ÷ √(3d) → softmax</text><text x="480" y="340" fill="#d7e8e3" font-size="15">沿候选 key 轴归一化，得到 A[i, j]</text><path d="M480 361 V394" stroke="#168579" stroke-width="2.5"/><text x="480" y="420" font-size="16" fill="#203035" font-weight="700">按注意力权重加权内容 Valueᶜ 生成新的隐藏状态</text></g></svg>