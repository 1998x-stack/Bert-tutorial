<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 442" role="img" aria-labelledby="t d"><title id="t">SimCSE 对齐与均匀性向量几何示意</title><desc id="d">左侧四组不同句向量几乎落在同一个方向，右侧四组句向量彼此分散，同句两次dropout视图彼此靠近。均为二维示意而非真实训练数据。</desc><rect width="960" height="442" rx="20" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" fill="#203035"><text x="28" y="43" font-size="23" font-weight="700">句向量应该既能“对齐”，又不全部“塌缩”</text><rect x="28" y="73" width="438" height="334" rx="15" fill="#fff" stroke="#dce5df"/><rect x="493" y="73" width="438" height="334" rx="15" fill="#fff" stroke="#dce5df"/><text x="245" y="108" text-anchor="middle" font-size="18" font-weight="700">塌缩：不同句子难以区分</text><text x="712" y="108" text-anchor="middle" font-size="18" font-weight="700">对齐 + 分散：可区分的角度</text><circle cx="245" cy="253" r="110" fill="none" stroke="#dce5df" stroke-width="2"/><circle cx="711" cy="253" r="110" fill="none" stroke="#dce5df" stroke-width="2"/><circle cx="292.9" cy="154.0" r="8" fill="#147f80"/><circle cx="791.5" cy="178.0" r="8" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="797.9" cy="185.6" r="8" fill="#147f80" stroke="#fff" stroke-width="2"/><circle cx="297.8" cy="156.5" r="8" fill="#7461ba"/><circle cx="786.0" cy="333.5" r="8" fill="#7461ba" stroke="#fff" stroke-width="2"/><circle cx="778.4" cy="339.9" r="8" fill="#7461ba" stroke="#fff" stroke-width="2"/><circle cx="302.6" cy="159.3" r="8" fill="#cc8b58"/><circle cx="630.5" cy="328.0" r="8" fill="#cc8b58" stroke="#fff" stroke-width="2"/><circle cx="624.1" cy="320.4" r="8" fill="#cc8b58" stroke="#fff" stroke-width="2"/><circle cx="307.2" cy="162.3" r="8" fill="#203035"/><circle cx="636.0" cy="172.5" r="8" fill="#203035" stroke="#fff" stroke-width="2"/><circle cx="643.6" cy="166.1" r="8" fill="#203035" stroke="#fff" stroke-width="2"/><text x="245" y="390" text-anchor="middle" font-size="14" fill="#53676d">不同颜色代表不同句子</text><text x="712" y="390" text-anchor="middle" font-size="14" fill="#53676d">每种颜色两点代表同句两次 dropout</text></g></svg>