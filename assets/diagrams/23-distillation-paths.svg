<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="t d"><title id="t">DistilBERT三种损失与TinyBERT两阶段知识路径</title><desc id="d">左侧教师BERT十二层向学生六层传递soft logits、MLM和隐藏cosine信息，右侧TinyBERT在通用蒸馏和任务特定蒸馏之间转换，中间层含embedding、attention、hidden与任务预测。</desc><rect width="960" height="490" rx="20" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" fill="#203035"><text x="25" y="42" font-size="23" font-weight="700">蒸馏不是“复制权重”：监督信号可以来自不同深度</text><rect x="25" y="77" width="442" height="376" rx="15" fill="#fff" stroke="#dce5df"/><text x="47" y="107" font-size="20" font-weight="700">DistilBERT：通用预训练蒸馏</text><rect x="48" y="132" width="167" height="106" rx="13" fill="#eeeafa" stroke="#7461ba"/><text x="131" y="166" text-anchor="middle" font-size="19">Teacher</text><text x="131" y="195" text-anchor="middle" font-size="17">12 blocks</text><rect x="263" y="132" width="178" height="106" rx="13" fill="#e2f0eb" stroke="#147f80"/><text x="352" y="166" text-anchor="middle" font-size="19">Student</text><text x="352" y="195" text-anchor="middle" font-size="17">6 blocks</text><path d="M216 185 H262" stroke="#7461ba" stroke-width="4"/><text x="244" y="163" font-size="13" text-anchor="middle">KD</text><rect x="48" y="278" width="391" height="47" rx="9" fill="#e2f0eb"/><text x="244" y="307" text-anchor="middle" font-size="17">soft logits KL + MLM + cosine</text><rect x="48" y="341" width="391" height="65" rx="11" fill="#203035"/><text x="244" y="367" text-anchor="middle" fill="#fff" font-size="15">只训练 student；teacher 冻结</text><text x="244" y="393" text-anchor="middle" fill="#dce8e3" font-size="14">部署只保留 student</text><rect x="492" y="77" width="442" height="376" rx="15" fill="#fff" stroke="#dce5df"/><text x="514" y="107" font-size="20" font-weight="700">TinyBERT：两阶段、分层对齐</text><rect x="512" y="133" width="398" height="102" rx="13" fill="#eeeafa" stroke="#7461ba"/><text x="711" y="163" text-anchor="middle" font-size="19">General distillation</text><text x="711" y="192" text-anchor="middle" font-size="15">Embedding · Attention · Hidden</text><text x="711" y="216" text-anchor="middle" font-size="14">通用语料 + 中间层映射</text><path d="M711 235 V275" stroke="#147f80" stroke-width="4"/><rect x="512" y="276" width="398" height="101" rx="13" fill="#e2f0eb" stroke="#147f80"/><text x="711" y="306" text-anchor="middle" font-size="19">Task-specific distillation</text><text x="711" y="334" text-anchor="middle" font-size="15">任务教师 · 数据增强 · Prediction</text><text x="711" y="357" text-anchor="middle" font-size="14">完成后只留任务 student</text><text x="711" y="424" text-anchor="middle" font-size="14" fill="#53676d">不同 hidden 宽度 → 可训练投影对齐</text></g></svg>