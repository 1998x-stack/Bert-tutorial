<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">MPNet 位置补偿与顺序目标依赖</title><desc id="desc">五个自然词槽位：the task is sentence classification。可见区提供前三个真词和第四第五个位置的 mask 占位。先预测 sentence，随后在可见前三词与已预测 sentence 的条件下预测 classification，始终不泄漏当前目标词。</desc><rect width="960" height="450" rx="22" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="39" font-size="21" font-weight="700" fill="#203035">MPNet = 全句位置占位 + 目标之间的顺序依赖</text><text x="480" y="67" font-size="14" fill="#53676d">教学示例：the task is sentence classification</text><g font-size="14"><rect x="30" y="100" width="170" height="83" rx="14" fill="#dff1eb" stroke="#168579" stroke-width="2"/><rect x="210" y="100" width="170" height="83" rx="14" fill="#dff1eb" stroke="#168579" stroke-width="2"/><rect x="390" y="100" width="170" height="83" rx="14" fill="#dff1eb" stroke="#168579" stroke-width="2"/><rect x="570" y="100" width="170" height="83" rx="14" fill="#fff1df" stroke="#cb7f39" stroke-width="2"/><rect x="750" y="100" width="180" height="83" rx="14" fill="#fff1df" stroke="#cb7f39" stroke-width="2"/><text x="115" y="125" fill="#53676d">位置 p1</text><text x="295" y="125" fill="#53676d">位置 p2</text><text x="475" y="125" fill="#53676d">位置 p3</text><text x="655" y="125" fill="#91521e">位置 p4</text><text x="840" y="125" fill="#91521e">位置 p5</text><text x="115" y="158" fill="#175b56" font-weight="700">the</text><text x="295" y="158" fill="#175b56" font-weight="700">task</text><text x="475" y="158" fill="#175b56" font-weight="700">is</text><text x="655" y="158" fill="#91521e" font-weight="700">[M] + p4</text><text x="840" y="158" fill="#91521e" font-weight="700">[M] + p5</text></g><text x="480" y="212" font-size="14" fill="#53676d">三个已知词 + 两个仅含位置信息的占位（不含真值）</text><rect x="83" y="264" width="346" height="102" rx="17" fill="#f0eefa" stroke="#7560ad" stroke-width="2"/><text x="256" y="290" font-size="17" font-weight="700" fill="#5c4691">第 1 步 · target p4</text><text x="256" y="318" font-size="15" fill="#5c4691">条件：the / task / is</text><text x="256" y="343" font-size="16" fill="#5c4691">预测 sentence</text><rect x="531" y="264" width="346" height="102" rx="17" fill="#203035"/><text x="704" y="290" font-size="17" font-weight="700" fill="#ffffff">第 2 步 · target p5</text><text x="704" y="318" font-size="15" fill="#d7e8e1">条件再加入 sentence</text><text x="704" y="343" font-size="16" fill="#ffffff">预测 classification</text><path d="M429 317 H531" stroke="#168579" stroke-width="3" fill="none"/><path d="M519 310 L532 317 L519 324" fill="none" stroke="#168579" stroke-width="3"/><text x="480" y="248" font-size="13" fill="#53676d">目标依赖</text><text x="480" y="413" font-size="14" fill="#b36b37">严格不允许：第 2 步从 p5 的占位读取 classification 的真实词</text></g></svg>