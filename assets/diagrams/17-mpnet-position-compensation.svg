<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="mpnet-t mpnet-d"><title id="mpnet-t">MPNet 如何融合目标依赖与全句位置补偿</title><desc id="mpnet-d">三行比较 MLM、PLM 和 MPNet。对于预测第二个目标，MLM 有全部 mask 槽位却无先前目标真词，PLM 有先前目标真词却缺后续占位，MPNet 同时有这些可用信息而不泄漏当前目标答案。</desc><rect width="960" height="440" rx="20" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" fill="#203035"><text x="28" y="44" font-size="23" font-weight="700">同一个预测步：可见的信息究竟差在哪里？</text><text x="28" y="74" font-size="15" fill="#53676d">目标：z₅（第二个被预测位置） · z₁–z₃ 为已知前缀 · z₄ 是前一个目标</text><rect x="28" y="102" width="902" height="88" rx="14" fill="#fff" stroke="#dce5df"/><rect x="28" y="200" width="902" height="88" rx="14" fill="#fff" stroke="#dce5df"/><rect x="28" y="298" width="902" height="109" rx="14" fill="#e2f0eb" stroke="#147f80" stroke-width="2"/><text x="47" y="131" font-size="18" font-weight="700">BERT · MLM</text><text x="47" y="229" font-size="18" font-weight="700">XLNet · PLM</text><text x="47" y="328" font-size="18" font-weight="700">MPNet</text><rect x="253" y="116" width="184" height="54" rx="10" fill="#dce8e3"/><text x="345" y="147" text-anchor="middle" font-size="15">真词 z₁ z₂ z₃</text><rect x="452" y="116" width="258" height="54" rx="10" fill="#eeeafa"/><text x="581" y="147" text-anchor="middle" font-size="15">M(z₄) M(z₅) M(z₆)</text><text x="729" y="144" font-size="14" fill="#53676d">无 z₄ 真词</text><rect x="253" y="214" width="259" height="54" rx="10" fill="#dce8e3"/><text x="383" y="245" text-anchor="middle" font-size="15">真词 z₁ z₂ z₃ z₄</text><rect x="525" y="214" width="266" height="54" rx="10" fill="#fbe6d4"/><text x="658" y="245" text-anchor="middle" font-size="15">缺完整 mask 位置集合</text><rect x="253" y="317" width="259" height="62" rx="10" fill="#dce8e3"/><text x="383" y="354" text-anchor="middle" font-size="15">真词 z₁ z₂ z₃ z₄</text><rect x="526" y="317" width="265" height="62" rx="10" fill="#eeeafa"/><text x="658" y="343" text-anchor="middle" font-size="15">M(z₄) M(z₅) M(z₆)</text><text x="658" y="365" text-anchor="middle" font-size="12">完整位置占位</text><text x="810" y="340" font-size="13" fill="#147f80">无 z₅ 真词</text><text x="810" y="360" font-size="13" fill="#147f80">→ 无目标泄漏</text></g></svg>