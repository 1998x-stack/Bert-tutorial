<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">中文 NLU 从标注合同到部署回滚的完整流水线</title><desc id="desc">输入意图标签与 group 切分校验，经过 tokenizer 和 BERT encoder 分类头，dev 选模型，test 冻结评价 macro F1，保存模型/tokenizer/label map 后部署。在整个流水线外有数据泄漏、版本与隐私审计，失败时回滚。</desc><rect width="960" height="480" rx="22" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="39" font-size="22" fill="#203035" font-weight="700">每个阶段有产物、指标和质量门禁</text><rect x="19" y="102" width="220" height="133" rx="17" fill="#e2f1e9" stroke="#168579" stroke-width="2"/><text x="129" y="137" font-size="17" fill="#203035" font-weight="700">1. 数据合同</text><text x="129" y="174" font-size="14" fill="#53676d">ID / Text / Label / Group</text><text x="129" y="207" font-size="13" fill="#53676d">train / dev / test</text><path d="M239 167 H257" stroke="#168579" stroke-width="3"/><rect x="257" y="102" width="220" height="133" rx="17" fill="#eeeafb" stroke="#7461ba" stroke-width="2"/><text x="367" y="137" font-size="17" fill="#203035" font-weight="700">2. 模型接口</text><text x="367" y="174" font-size="14" fill="#53676d">Tokenizer + Encoder</text><text x="367" y="207" font-size="13" fill="#53676d">[B,T] → [B,3]</text><path d="M477 167 H495" stroke="#168579" stroke-width="3"/><rect x="495" y="102" width="220" height="133" rx="17" fill="#e2f1e9" stroke="#168579" stroke-width="2"/><text x="605" y="137" font-size="17" fill="#203035" font-weight="700">3. 训练与选择</text><text x="605" y="174" font-size="14" fill="#53676d">Train 优化 · Dev 选模</text><text x="605" y="207" font-size="13" fill="#53676d">冻结参数与阈值</text><path d="M715 167 H733" stroke="#168579" stroke-width="3"/><rect x="733" y="102" width="220" height="133" rx="17" fill="#eeeafb" stroke="#7461ba" stroke-width="2"/><text x="843" y="137" font-size="17" fill="#203035" font-weight="700">4. 测试与发布</text><text x="843" y="174" font-size="14" fill="#53676d">Test 一次评价</text><text x="843" y="207" font-size="13" fill="#53676d">F1 / p95 / manifest</text><rect x="54" y="290" width="852" height="111" rx="18" fill="#203035"/><text x="480" y="322" font-size="19" fill="#ffffff" font-weight="700">全程审计：数据来源 / 防泄漏 / Label Map / Checksum / 容差</text><text x="480" y="356" font-size="15" fill="#d9ebe3">错误分析 · 少数类召回 · 拒识与权限 · 发布监控与版本回滚</text><text x="480" y="381" font-size="14" fill="#d9ebe3">教学语料不等于真实业务评测</text><text x="480" y="442" font-size="15" fill="#53676d">数据、模型、评估、服务四类版本必须能追踪、复现与恢复</text></g></svg>