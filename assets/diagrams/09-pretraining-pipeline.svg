<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">BERT 预训练数据工程流水线</title><desc id="desc">从数据来源和许可，经过正文抽取、规范化、语言质量过滤、去重、文档级切分、tokenize 和 pack、动态 mask，形成训练 batch。</desc><rect width="900" height="390" rx="20" fill="#f5f7f2"/><g font-family="system-ui,sans-serif"><text x="32" y="42" fill="#203035" font-size="20" font-weight="700">从文档来源到训练 batch，每一步都可审计</text><rect x="32" y="78" width="190" height="70" rx="12" fill="#fff" stroke="#9aaba6" stroke-width="2"/><text x="127" y="105" text-anchor="middle" fill="#203035" font-size="15" font-weight="700">Source &amp; License</text><text x="127" y="128" text-anchor="middle" fill="#53676d" font-size="12">provenance / privacy</text><path d="M222 113 H246" stroke="#147f80" stroke-width="3"/><path d="M238 105 L250 113 L238 121" fill="none" stroke="#147f80" stroke-width="3"/><rect x="254" y="78" width="190" height="70" rx="12" fill="#e2f0eb" stroke="#147f80" stroke-width="2"/><text x="349" y="105" text-anchor="middle" fill="#203035" font-size="15" font-weight="700">Extract &amp; Clean</text><text x="349" y="128" text-anchor="middle" fill="#53676d" font-size="12">HTML / encoding / boilerplate</text><path d="M444 113 H468" stroke="#147f80" stroke-width="3"/><path d="M460 105 L472 113 L460 121" fill="none" stroke="#147f80" stroke-width="3"/><rect x="476" y="78" width="190" height="70" rx="12" fill="#eeeafa" stroke="#7461ba" stroke-width="2"/><text x="571" y="105" text-anchor="middle" fill="#203035" font-size="15" font-weight="700">Filter &amp; Dedup</text><text x="571" y="128" text-anchor="middle" fill="#53676d" font-size="12">language / quality / near-dup</text><path d="M666 113 H690" stroke="#147f80" stroke-width="3"/><path d="M682 105 L694 113 L682 121" fill="none" stroke="#147f80" stroke-width="3"/><rect x="698" y="78" width="170" height="70" rx="12" fill="#fbede7" stroke="#c96c4c" stroke-width="2"/><text x="783" y="105" text-anchor="middle" fill="#203035" font-size="15" font-weight="700">Split by Doc</text><text x="783" y="128" text-anchor="middle" fill="#53676d" font-size="12">train / held-out</text><path d="M783 148 V180 H450 V204" fill="none" stroke="#9aaba6" stroke-width="2"/><rect x="230" y="204" width="440" height="64" rx="12" fill="#203035"/><text x="450" y="230" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Tokenizer → Sequence Packing</text><text x="450" y="252" text-anchor="middle" fill="#dce8e3" font-size="12">preserve document boundaries and special tokens</text><path d="M450 268 V296" stroke="#147f80" stroke-width="3"/><path d="M442 288 L450 300 L458 288" fill="none" stroke="#147f80" stroke-width="3"/><rect x="300" y="304" width="300" height="58" rx="12" fill="#d7eee7" stroke="#147f80" stroke-width="2"/><text x="450" y="329" text-anchor="middle" fill="#203035" font-size="15" font-weight="700">Mask / Collate / Shard</text><text x="450" y="348" text-anchor="middle" fill="#53676d" font-size="12">input_ids + labels + attention_mask</text></g></svg>