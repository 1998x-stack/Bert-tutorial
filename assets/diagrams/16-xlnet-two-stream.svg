<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="xlnet-title xlnet-desc"><title id="xlnet-title">XLNet 预测顺序与双流注意力</title><desc id="xlnet-desc">原文位置保持固定。排列从左至右 1 2 3 4 和混合 3 1 4 2 中，预测位置 2 时可见内容不同。下方用内容流与查询流展示目标泄漏隔离。</desc><rect width="960" height="440" rx="20" fill="#f5f7f2"/><g font-family="system-ui, sans-serif" fill="#203035"><text x="30" y="40" font-weight="700" font-size="23">同一个目标，不同的分解顺序</text><text x="30" y="70" font-size="14" fill="#53676d">原始位置始终是 1: the / 2: chef / 3: cooked / 4: dinner</text><rect x="24" y="92" width="435" height="140" rx="15" fill="#fff" stroke="#dce5df"/><rect x="483" y="92" width="453" height="140" rx="15" fill="#fff" stroke="#dce5df"/><text x="43" y="120" font-size="17" font-weight="700">排列 A · 1 → 2 → 3 → 4</text><text x="504" y="120" font-size="17" font-weight="700">排列 B · 3 → 1 → 4 → 2</text><rect x="41" y="141" width="93" height="47" rx="8" fill="#e2f0eb"/><text x="88" y="170" text-anchor="middle" font-size="15">the</text><rect x="144" y="141" width="93" height="47" rx="8" fill="#eeeafa"/><text x="190" y="170" text-anchor="middle" font-size="15">chef ?</text><rect x="500" y="141" width="95" height="47" rx="8" fill="#e2f0eb"/><text x="547" y="170" text-anchor="middle" font-size="15">cooked</text><rect x="600" y="141" width="78" height="47" rx="8" fill="#e2f0eb"/><text x="639" y="170" text-anchor="middle" font-size="15">the</text><rect x="683" y="141" width="92" height="47" rx="8" fill="#e2f0eb"/><text x="729" y="170" text-anchor="middle" font-size="15">dinner</text><rect x="781" y="141" width="132" height="47" rx="8" fill="#eeeafa"/><text x="846" y="170" text-anchor="middle" font-size="15">chef ?</text><text x="42" y="213" font-size="13" fill="#53676d">位置 2 只看得见 1</text><text x="501" y="213" font-size="13" fill="#53676d">位置 2 可见 3、1、4</text><rect x="25" y="263" width="910" height="140" rx="16" fill="#203035"/><rect x="45" y="290" width="378" height="78" rx="12" fill="#dce8e3"/><text x="235" y="319" text-anchor="middle" font-size="18" font-weight="700">Content stream · h</text><text x="235" y="347" text-anchor="middle" font-size="15">允许携带已知位置的 token 内容</text><rect x="535" y="290" width="378" height="78" rx="12" fill="#eeeafa"/><text x="724" y="319" text-anchor="middle" font-size="18" font-weight="700">Query stream · g</text><text x="724" y="347" text-anchor="middle" font-size="15">知道目标位置，不读取目标词身份</text><path d="M423 329 H528" stroke="#67b4ac" stroke-width="4"/><path d="M516 322 L529 329 L516 336" fill="none" stroke="#67b4ac" stroke-width="4"/><text x="480" y="393" text-anchor="middle" font-size="13" fill="#dce8e3">Query 的 K/V 只来自排列前缀中的 Content states</text></g></svg>