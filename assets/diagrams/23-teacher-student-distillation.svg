<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">DistilBERT 和 TinyBERT 的教师学生知识传递层次</title><desc id="desc">左侧深层 teacher 和右侧浅层 student，通过词表分布、隐藏向量、注意力矩阵连接。DistilBERT 用 MLM、蒸馏和 cosine；TinyBERT 另将 embedding 和各层内部知识用于通用与下游两阶段蒸馏。</desc><rect width="960" height="450" rx="22" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="36" font-size="21" fill="#203035" font-weight="700">Teacher → Student：传递的不是某层权重副本</text><text x="221" y="72" fill="#53676d" font-size="16" font-weight="700">Teacher · BERT-base 12 层</text><text x="713" y="72" fill="#53676d" font-size="16" font-weight="700">Student · DistilBERT 6 层</text><rect x="91" y="92" width="260" height="17" rx="5" fill="#cfece2" stroke="#168579"/><text x="221" y="104" font-size="10.5" fill="#175a54">Teacher layer 1</text><rect x="91" y="113" width="260" height="17" rx="5" fill="#e2f1eb" stroke="#168579"/><text x="221" y="125" font-size="10.5" fill="#175a54">Teacher layer 2</text><rect x="91" y="134" width="260" height="17" rx="5" fill="#cfece2" stroke="#168579"/><text x="221" y="146" font-size="10.5" fill="#175a54">Teacher layer 3</text><rect x="91" y="155" width="260" height="17" rx="5" fill="#e2f1eb" stroke="#168579"/><text x="221" y="167" font-size="10.5" fill="#175a54">Teacher layer 4</text><rect x="91" y="176" width="260" height="17" rx="5" fill="#cfece2" stroke="#168579"/><text x="221" y="188" font-size="10.5" fill="#175a54">Teacher layer 5</text><rect x="91" y="197" width="260" height="17" rx="5" fill="#e2f1eb" stroke="#168579"/><text x="221" y="209" font-size="10.5" fill="#175a54">Teacher layer 6</text><rect x="91" y="218" width="260" height="17" rx="5" fill="#cfece2" stroke="#168579"/><text x="221" y="230" font-size="10.5" fill="#175a54">Teacher layer 7</text><rect x="91" y="239" width="260" height="17" rx="5" fill="#e2f1eb" stroke="#168579"/><text x="221" y="251" font-size="10.5" fill="#175a54">Teacher layer 8</text><rect x="91" y="260" width="260" height="17" rx="5" fill="#cfece2" stroke="#168579"/><text x="221" y="272" font-size="10.5" fill="#175a54">Teacher layer 9</text><rect x="91" y="281" width="260" height="17" rx="5" fill="#e2f1eb" stroke="#168579"/><text x="221" y="293" font-size="10.5" fill="#175a54">Teacher layer 10</text><rect x="91" y="302" width="260" height="17" rx="5" fill="#cfece2" stroke="#168579"/><text x="221" y="314" font-size="10.5" fill="#175a54">Teacher layer 11</text><rect x="91" y="323" width="260" height="17" rx="5" fill="#e2f1eb" stroke="#168579"/><text x="221" y="335" font-size="10.5" fill="#175a54">Teacher layer 12</text><rect x="605" y="104" width="220" height="34" rx="7" fill="#ebe5f9" stroke="#7561b0"/><text x="715" y="126" font-size="13" fill="#614c91">Student layer 1</text><rect x="605" y="146" width="220" height="34" rx="7" fill="#f0eafb" stroke="#7561b0"/><text x="715" y="168" font-size="13" fill="#614c91">Student layer 2</text><rect x="605" y="188" width="220" height="34" rx="7" fill="#ebe5f9" stroke="#7561b0"/><text x="715" y="210" font-size="13" fill="#614c91">Student layer 3</text><rect x="605" y="230" width="220" height="34" rx="7" fill="#f0eafb" stroke="#7561b0"/><text x="715" y="252" font-size="13" fill="#614c91">Student layer 4</text><rect x="605" y="272" width="220" height="34" rx="7" fill="#ebe5f9" stroke="#7561b0"/><text x="715" y="294" font-size="13" fill="#614c91">Student layer 5</text><rect x="605" y="314" width="220" height="34" rx="7" fill="#f0eafb" stroke="#7561b0"/><text x="715" y="336" font-size="13" fill="#614c91">Student layer 6</text><path d="M352 154 H602 M352 240 H602 M352 327 H602" stroke="#168579" stroke-width="2" stroke-dasharray="6 5"/><text x="479" y="142" font-size="12" fill="#168579">Logits KL</text><text x="479" y="229" font-size="12" fill="#168579">Hidden align</text><text x="479" y="315" font-size="12" fill="#168579">Attention</text><rect x="91" y="378" width="734" height="46" rx="13" fill="#203035"/><text x="458" y="398" font-size="15" fill="#fff" font-weight="700">DistilBERT：MLM + KD + Cosine</text><text x="458" y="414" font-size="12" fill="#dce8e3">TinyBERT：embedding / hidden / attention / prediction；通用阶段 + 任务阶段</text></g></svg>