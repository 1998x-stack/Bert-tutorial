<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 455" role="img" aria-labelledby="title desc"><title id="title">MobileBERT 教师、学生与端侧部署流程</title><desc id="desc">特制倒瓶颈教师经过知识迁移生成深窄 MobileBERT 学生；接着做下游微调，导出 ONNX，选择可选的 INT8 量化，并在真实端侧 CPU 上验收 tokenizer、推理、后处理和延迟。</desc><rect width="960" height="455" rx="22" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="39" font-size="22" fill="#203035" font-weight="700">模型小型化和设备运行是两道不同问题</text><rect x="29" y="88" width="259" height="102" rx="16" fill="#eeeafb" stroke="#7461ba" stroke-width="2"/><text x="158" y="119" fill="#624a95" font-size="18" font-weight="700">特制 Teacher</text><text x="158" y="148" fill="#624a95" font-size="15">Inverted-bottleneck</text><text x="158" y="173" fill="#624a95" font-size="13">BERT-large / 训练时存在</text><rect x="346" y="88" width="267" height="102" rx="16" fill="#dff2e9" stroke="#168579" stroke-width="2"/><text x="479" y="119" fill="#175e54" font-size="18" font-weight="700">MobileBERT Student</text><text x="479" y="148" fill="#175e54" font-size="15">深层 · 窄 bottleneck</text><text x="479" y="173" fill="#175e54" font-size="13">部署时保留 Student</text><path d="M288 141 H346" stroke="#168579" stroke-width="3"/><text x="317" y="126" font-size="11" fill="#53676d">Distill</text><rect x="670" y="88" width="261" height="102" rx="16" fill="#fff0df" stroke="#c78546" stroke-width="2"/><text x="801" y="119" font-size="18" fill="#95552c" font-weight="700">任务微调 / 导出</text><text x="801" y="149" font-size="15" fill="#95552c">Fine-tune → ONNX</text><text x="801" y="173" font-size="13" fill="#95552c">FP32 输出先对齐</text><path d="M613 141 H670" stroke="#168579" stroke-width="3"/><rect x="129" y="256" width="702" height="102" rx="18" fill="#203035"/><text x="480" y="285" fill="#fff" font-size="19" font-weight="700">设备运行完整路径</text><text x="480" y="318" fill="#e0ede8" font-size="15">Tokenizer → Input IDs/Mask → ONNX Runtime CPU → 后处理</text><text x="480" y="340" fill="#d4e7df" font-size="14">可选 INT8 · 固定设备与输入长度 · 真实 p50/p95/peak RSS</text><path d="M800 190 V230 H480 V256" stroke="#168579" stroke-width="3" fill="none"/><text x="480" y="412" fill="#53676d" font-size="14">不能从参数量变化直接断言手机端到端延迟倍率</text></g></svg>