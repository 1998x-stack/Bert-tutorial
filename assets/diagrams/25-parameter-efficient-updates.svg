<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 455" role="img" aria-labelledby="title desc"><title id="title">LoRA 低秩增量与 AdaLoRA BitFit 对比</title><desc id="desc">左侧冻结基础矩阵 W0，旁路 A 将输入维映射到 rank r，再由 B 映射到输出维并与 W0x 相加。下侧 AdaLoRA 按重要性给不同层分配 rank；BitFit 只修改偏置。</desc><rect width="960" height="455" rx="22" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="39" font-size="22" font-weight="700" fill="#203035">基础权重不变，只学任务需要的更新</text><rect x="30" y="94" width="206" height="111" rx="16" fill="#e3f1e9" stroke="#168579" stroke-width="2"/><text x="133" y="128" fill="#175a55" font-size="18" font-weight="700">Frozen W₀</text><text x="133" y="157" fill="#175a55" font-size="16">[d_out, d_in]</text><text x="133" y="183" fill="#53676d" font-size="13">原模型前向仍存在</text><rect x="292" y="94" width="182" height="111" rx="16" fill="#eeeafb" stroke="#7461ba" stroke-width="2"/><text x="383" y="129" fill="#614b95" font-size="20" font-weight="700">A</text><text x="383" y="156" fill="#614b95" font-size="16">[r, d_in]</text><text x="383" y="181" fill="#614b95" font-size="13">压到 rank r</text><rect x="530" y="94" width="182" height="111" rx="16" fill="#eeeafb" stroke="#7461ba" stroke-width="2"/><text x="621" y="129" fill="#614b95" font-size="20" font-weight="700">B</text><text x="621" y="156" fill="#614b95" font-size="16">[d_out, r]</text><text x="621" y="181" fill="#614b95" font-size="13">映射回输出</text><rect x="767" y="94" width="164" height="111" rx="16" fill="#203035"/><text x="849" y="131" fill="#fff" font-size="17" font-weight="700">W₀x + BAx</text><text x="849" y="163" fill="#d7e9e2" font-size="13">低秩残差加和</text><path d="M236 149 H286 M474 149 H523 M712 149 H760" stroke="#168579" stroke-width="3"/><text x="480" y="248" fill="#53676d" font-size="15">示例 768×768，rank=8：完整 W=589,824；LoRA 增量=12,288</text><rect x="56" y="286" width="402" height="115" rx="17" fill="#fff0df" stroke="#c78546" stroke-width="2"/><text x="257" y="317" fill="#a05c2e" font-size="19" font-weight="700">AdaLoRA：按重要性分配 rank</text><text x="257" y="346" fill="#a05c2e" font-size="15">Layer A r=4 · Layer B r=12</text><text x="257" y="372" fill="#53676d" font-size="13">示意分配，不代表算法实际分数</text><rect x="502" y="286" width="402" height="115" rx="17" fill="#e0f1eb" stroke="#168579" stroke-width="2"/><text x="703" y="317" fill="#175e55" font-size="19" font-weight="700">BitFit：只训练 Bias</text><text x="703" y="348" fill="#175e55" font-size="15">W 冻结 · b 可更新</text><text x="703" y="373" fill="#53676d" font-size="13">无 bias 的层无可调 bias 参数</text></g></svg>