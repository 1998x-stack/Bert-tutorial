<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 465" role="img" aria-labelledby="title desc"><title id="title">中文 BERT 的 token 与整词遮盖分组</title><desc id="desc">句子北京大学生喜欢阅读先分成北京、大学生、喜欢、阅读四个词组，同时输入的 WordPiece 仍按北、京、大、学、生、喜、欢、阅、读逐字符。选中大学生使三个 token 的标签同时成为 MLM 目标，下半部分展示其他中文预训练增强路线。</desc><rect width="960" height="465" rx="22" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="37" font-size="21" font-weight="700" fill="#203035">token 是字；监督目标可以按词聚合</text><text x="480" y="65" font-size="14" fill="#53676d">教学分词：北京 / 大学生 / 喜欢 / 阅读</text>
<rect x="25" y="93" width="211" height="64" rx="14" fill="#e2f0e9" stroke="#168579" stroke-width="2"/><rect x="244" y="93" width="251" height="64" rx="14" fill="#fff0df" stroke="#ca793f" stroke-width="3"/><rect x="503" y="93" width="211" height="64" rx="14" fill="#e2f0e9" stroke="#168579" stroke-width="2"/><rect x="722" y="93" width="212" height="64" rx="14" fill="#e2f0e9" stroke="#168579" stroke-width="2"/>
<text x="130" y="134" font-size="21" fill="#145c55" font-weight="700">北　京</text><text x="369" y="134" font-size="21" fill="#a45a30" font-weight="700">大　学　生</text><text x="608" y="134" font-size="21" fill="#145c55" font-weight="700">喜　欢</text><text x="829" y="134" font-size="21" fill="#145c55" font-weight="700">阅　读</text>
<text x="480" y="194" font-size="14" fill="#53676d">选中词组“大学生” → 目标位置 2、3、4 均预测其原始 token ID</text><rect x="122" y="220" width="716" height="70" rx="14" fill="#203035"/><text x="480" y="247" font-size="18" fill="#ffffff" font-weight="700">输入替换示意：北 京 [MASK] [MASK] [MASK] 喜 欢 阅 读</text><text x="480" y="274" font-size="14" fill="#d8e9e2">目标标签始终是：大、学、生（不依赖实际替换值）</text>
<text x="480" y="329" font-size="15" font-weight="700" fill="#203035">其他中文模型解决不同层面的问题，不要混成一套默认架构</text><rect x="27" y="347" width="279" height="75" rx="14" fill="#eeeafb" stroke="#7a65b7" stroke-width="2"/><rect x="340" y="347" width="280" height="75" rx="14" fill="#fff0df" stroke="#c98545" stroke-width="2"/><rect x="654" y="347" width="280" height="75" rx="14" fill="#e2f1e9" stroke="#168579" stroke-width="2"/>
<text x="166" y="374" font-size="16" font-weight="700" fill="#624b91">ERNIE</text><text x="166" y="397" font-size="13" fill="#624b91">短语 / 实体级 Mask</text><text x="480" y="374" font-size="16" font-weight="700" fill="#9a5731">MacBERT</text><text x="480" y="397" font-size="13" fill="#9a5731">相似词替换 · MLM 纠错</text><text x="794" y="374" font-size="16" font-weight="700" fill="#145b56">ChineseBERT (ACL 2021)</text><text x="794" y="397" font-size="13" fill="#145b56">字形 + 拼音输入融合</text></g></svg>