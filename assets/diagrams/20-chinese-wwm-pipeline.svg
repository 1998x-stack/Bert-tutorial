<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="c-t c-d"><title id="c-t">中文 BERT 整词掩码的训练数据处理流程</title><desc id="c-d">原句人工智能改变生活经词法边界识别为人工智能、改变、生活；假定逐字 tokenizer 输出八个汉字 token；词级选择人工智能后，前四个 token 都是 MLM 目标。最下方对比 WWM、ERNIE、MacBERT 与 ChineseBERT 在训练信号中的不同作用。</desc><rect width="960" height="470" rx="20" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" fill="#203035"><text x="26" y="42" font-size="23" font-weight="700">中文 WWM：改变的是“哪些 token 一起被选中”</text><rect x="25" y="69" width="910" height="68" rx="14" fill="#fff" stroke="#dce5df"/><text x="44" y="94" font-size="15" fill="#53676d">原句</text><text x="480" y="115" text-anchor="middle" font-size="23" font-weight="700">人工智能改变生活</text><rect x="25" y="156" width="910" height="84" rx="14" fill="#fff" stroke="#dce5df"/><text x="44" y="182" font-size="15" fill="#53676d">词界</text><rect x="202" y="170" width="290" height="52" rx="10" fill="#e2f0eb" stroke="#147f80" stroke-width="2"/><text x="347" y="203" text-anchor="middle" font-size="19">[人工智能]</text><rect x="512" y="170" width="186" height="52" rx="10" fill="#eeeafa"/><text x="605" y="203" text-anchor="middle" font-size="19">[改变]</text><rect x="717" y="170" width="184" height="52" rx="10" fill="#eeeafa"/><text x="809" y="203" text-anchor="middle" font-size="19">[生活]</text><rect x="25" y="261" width="910" height="101" rx="14" fill="#203035"/><text x="45" y="289" font-size="16" fill="#fff">假设 tokenizer 逐字切分；选中第一组 → 四个 token 共同成为 MLM 目标</text><rect x="166" y="306" width="76" height="39" rx="7" fill="#9de0ce"/><rect x="251" y="306" width="76" height="39" rx="7" fill="#9de0ce"/><rect x="336" y="306" width="76" height="39" rx="7" fill="#9de0ce"/><rect x="421" y="306" width="76" height="39" rx="7" fill="#9de0ce"/><text x="204" y="331" text-anchor="middle" font-size="16">[M] 人</text><text x="289" y="331" text-anchor="middle" font-size="16">[M] 工</text><text x="374" y="331" text-anchor="middle" font-size="16">[M] 智</text><text x="459" y="331" text-anchor="middle" font-size="16">[M] 能</text><text x="542" y="331" fill="#dce8e3" font-size="19">改 变 生 活</text><rect x="25" y="386" width="910" height="60" rx="12" fill="#eeeafa" stroke="#7461ba"/><text x="46" y="411" font-size="15" font-weight="700">改进维度：</text><text x="46" y="433" font-size="14">WWM：词界分组　 ERNIE：实体/短语目标　 MacBERT：相似词纠错　 ChineseBERT：字形/拼音输入</text></g></svg>