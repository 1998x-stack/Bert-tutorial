<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">ModernBERT 交替局部与全局注意力的六层示意</title><desc id="desc">六层示意：第 1、2、4、5 层是局部注意力，第 3、6 层是全局注意力。每层都接 RoPE Query Key，GeGLU FFN 用内容与门控两个投影，unpadding 在输入批次排除 pad。</desc><rect width="960" height="460" rx="22" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="37" font-size="22" fill="#203035" font-weight="700">沿着深度交替：局部 → 局部 → 全局</text><text x="480" y="65" font-size="14" fill="#53676d">一个六层教学切片，实际网络层数与配置应由 checkpoint 决定</text><rect x="46" y="94" width="583" height="38" rx="12" fill="#e0f1ea" stroke="#168579" stroke-width="2"/><text x="178" y="119" font-size="16" font-weight="700" fill="#176056">Layer 1 · LOCAL</text><text x="451" y="119" font-size="14" fill="#53676d">双向窗口内可见</text><rect x="46" y="141" width="583" height="38" rx="12" fill="#e0f1ea" stroke="#168579" stroke-width="2"/><text x="178" y="166" font-size="16" font-weight="700" fill="#176056">Layer 2 · LOCAL</text><text x="451" y="166" font-size="14" fill="#53676d">双向窗口内可见</text><rect x="46" y="188" width="583" height="38" rx="12" fill="#203035" stroke="#203035" stroke-width="2"/><text x="178" y="213" font-size="16" font-weight="700" fill="#ffffff">Layer 3 · GLOBAL</text><text x="451" y="213" font-size="14" fill="#dceae5">全句 token 互通</text><rect x="46" y="235" width="583" height="38" rx="12" fill="#e0f1ea" stroke="#168579" stroke-width="2"/><text x="178" y="260" font-size="16" font-weight="700" fill="#176056">Layer 4 · LOCAL</text><text x="451" y="260" font-size="14" fill="#53676d">双向窗口内可见</text><rect x="46" y="282" width="583" height="38" rx="12" fill="#e0f1ea" stroke="#168579" stroke-width="2"/><text x="178" y="307" font-size="16" font-weight="700" fill="#176056">Layer 5 · LOCAL</text><text x="451" y="307" font-size="14" fill="#53676d">双向窗口内可见</text><rect x="46" y="329" width="583" height="38" rx="12" fill="#203035" stroke="#203035" stroke-width="2"/><text x="178" y="354" font-size="16" font-weight="700" fill="#ffffff">Layer 6 · GLOBAL</text><text x="451" y="354" font-size="14" fill="#dceae5">全句 token 互通</text><rect x="667" y="95" width="263" height="130" rx="16" fill="#eeeafb" stroke="#7461ba" stroke-width="2"/><text x="798" y="125" font-size="19" font-weight="700" fill="#60498d">RoPE</text><text x="798" y="151" font-size="14" fill="#60498d">Q / K 旋转</text><text x="798" y="176" font-size="13" fill="#53676d">位置影响 attention score</text><text x="798" y="201" font-size="13" fill="#53676d">无需传统绝对位置表</text><rect x="667" y="251" width="263" height="125" rx="16" fill="#fff0de" stroke="#c78546" stroke-width="2"/><text x="798" y="281" font-size="19" font-weight="700" fill="#9d5b31">GeGLU FFN</text><text x="798" y="310" font-size="14" fill="#9d5b31">内容 ⊙ 门控</text><text x="798" y="338" font-size="13" fill="#53676d">恢复 H 维输出</text><text x="480" y="432" font-size="15" fill="#53676d">Unpadding/packing 是批次布局层面的优化，必须保持样本隔离</text></g></svg>