<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">XLNet 的自然位置、排列预测顺序和双流注意力</title><desc id="desc">四个自然位置不移动，排列预测顺序为三、一、四、二。对最终目标位置二，其 query stream 可以读取三、一、四位置的 content，但不能读取位置二的真实内容。</desc><rect width="960" height="450" rx="22" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="38" font-size="22" fill="#203035" font-weight="700">位置不移动，变化的是预测顺序</text><text x="480" y="65" font-size="14" fill="#53676d">自然位置始终：1　2　3　4 ｜ 排列因子：3 → 1 → 4 → 2</text>
<g><rect x="45" y="91" width="200" height="76" rx="13" fill="#ffffff" stroke="#d4e0dc" stroke-width="2"/><rect x="267" y="91" width="200" height="76" rx="13" fill="#fff2e3" stroke="#d78246" stroke-width="3"/><rect x="489" y="91" width="200" height="76" rx="13" fill="#ffffff" stroke="#d4e0dc" stroke-width="2"/><rect x="711" y="91" width="200" height="76" rx="13" fill="#ffffff" stroke="#d4e0dc" stroke-width="2"/><text x="145" y="120" fill="#53676d">位置 1 · 排列第 2</text><text x="367" y="120" fill="#955526">位置 2 · 排列第 4</text><text x="589" y="120" fill="#53676d">位置 3 · 排列第 1</text><text x="811" y="120" fill="#53676d">位置 4 · 排列第 3</text><text x="145" y="148" fill="#203035" font-weight="700">小明</text><text x="367" y="148" fill="#955526" font-weight="700">今天</text><text x="589" y="148" fill="#203035" font-weight="700">去了</text><text x="811" y="148" fill="#203035" font-weight="700">学校</text></g>
<rect x="50" y="218" width="855" height="79" rx="16" fill="#e0f2ed" stroke="#168579" stroke-width="2"/><text x="480" y="244" fill="#155b57" font-size="17" font-weight="700">Content stream：先前已可用内容 x₃、x₁、x₄</text><text x="480" y="271" fill="#155b57" font-size="15">拥有真实 token 表征；x₂ 的 content 也存在，但必须与预测 x₂ 的 query 隔离</text>
<path d="M145 168 V193 H300 V218 M589 168 V206 H480 V218 M811 168 V195 H660 V218" fill="none" stroke="#168579" stroke-width="2.5"/>
<rect x="280" y="348" width="400" height="68" rx="15" fill="#203035"/><text x="480" y="375" fill="#ffffff" font-size="18" font-weight="700">Query stream：预测位置 2</text><text x="480" y="398" fill="#d9e9e5" font-size="14">知道要预测“位置 2”，但读不到“今天”</text><path d="M480 297 V348" stroke="#168579" stroke-width="4"/><path d="M367 167 V217" stroke="#d78246" stroke-width="3" stroke-dasharray="7 6"/><path d="M352 190 L382 205 M382 190 L352 205" stroke="#bc643d" stroke-width="3"/><text x="760" y="337" fill="#a85e35" font-size="14">橙色虚线：禁止目标内容泄漏</text></g></svg>