<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">端侧模型从训练checkpoint到量化运行验收链路</title><desc id="d">输入文本和配套Tokenizer进入导出模型图，量化校准与operator支持审查后在CPU或NPU执行，记录准确率、冷启动、p95 latency、峰值RAM并进行回归。</desc><rect width="960" height="480" rx="20" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" fill="#203035"><text x="26" y="43" font-size="23" font-weight="700">端侧部署的真正闭环：每一步都可能改变正确性</text><rect x="27" y="128" width="173" height="134" rx="16" fill="#e2f0eb" stroke="#147f80"/><text x="113" y="176" text-anchor="middle" font-size="17" font-weight="700">文本 + Tokenizer</text><text x="113" y="210" text-anchor="middle" font-size="13">必须与 checkpoint 配套</text><path d="M200 192 H212" stroke="#147f80" stroke-width="3"/><rect x="212" y="128" width="173" height="134" rx="16" fill="#eeeafa" stroke="#7461ba"/><text x="298" y="176" text-anchor="middle" font-size="17" font-weight="700">导出模型图</text><text x="298" y="210" text-anchor="middle" font-size="13">ONNX / TFLite / opset</text><path d="M385 192 H397" stroke="#147f80" stroke-width="3"/><rect x="397" y="128" width="173" height="134" rx="16" fill="#e2f0eb" stroke="#147f80"/><text x="483" y="176" text-anchor="middle" font-size="17" font-weight="700">校准与量化</text><text x="483" y="210" text-anchor="middle" font-size="13">FP32/FP16/INT8 方案</text><path d="M570 192 H582" stroke="#147f80" stroke-width="3"/><rect x="582" y="128" width="173" height="134" rx="16" fill="#eeeafa" stroke="#7461ba"/><text x="668" y="176" text-anchor="middle" font-size="17" font-weight="700">算子执行</text><text x="668" y="210" text-anchor="middle" font-size="13">CPU / NPU / fallback</text><path d="M755 192 H767" stroke="#147f80" stroke-width="3"/><rect x="767" y="128" width="173" height="134" rx="16" fill="#e2f0eb" stroke="#147f80"/><text x="853" y="176" text-anchor="middle" font-size="17" font-weight="700">端到端测量</text><text x="853" y="210" text-anchor="middle" font-size="13">p95 · RAM · F1</text><rect x="27" y="310" width="904" height="115" rx="16" fill="#203035"/><text x="479" y="344" text-anchor="middle" font-size="19" fill="#fff" font-weight="700">两个不可省略的独立验收结果</text><text x="253" y="379" text-anchor="middle" font-size="16" fill="#dce8e3">质量：精度下降？长尾样本是否异常？</text><text x="706" y="379" text-anchor="middle" font-size="16" fill="#dce8e3">性能：p50 / p95 / 冷热启动 / 峰值 RAM</text><text x="479" y="408" text-anchor="middle" font-size="13" fill="#9de0ce">把 tokenizer 和后处理也算进一次用户请求的延迟</text></g></svg>