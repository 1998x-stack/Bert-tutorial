<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">MLM、Whole-word、Span 与句间目标比较</title><desc id="desc">左侧是 token 级 MLM，中间是 whole-word 和连续 span 遮盖，右侧是 NSP 与 SOP 的正负样本构造。</desc><rect width="900" height="350" rx="20" fill="#f5f7f2"/><g font-family="system-ui,sans-serif"><text x="32" y="42" font-size="20" font-weight="700" fill="#203035">同样是预训练，监督单位可以完全不同</text><rect x="28" y="72" width="260" height="230" rx="15" fill="#fff" stroke="#dce5df"/><text x="158" y="101" text-anchor="middle" font-size="16" font-weight="700" fill="#147f80">Token-level MLM</text><g font-size="13" text-anchor="middle" fill="#203035"><rect x="48" y="128" width="58" height="34" rx="7" fill="#e4e9e5"/><text x="77" y="150">The</text><rect x="112" y="128" width="58" height="34" rx="7" fill="#147f80"/><text x="141" y="150" fill="#fff">[M]</text><rect x="176" y="128" width="58" height="34" rx="7" fill="#e4e9e5"/><text x="205" y="150">is</text><rect x="240" y="128" width="32" height="34" rx="7" fill="#e4e9e5"/><text x="256" y="150">…</text></g><text x="158" y="202" text-anchor="middle" font-size="13" fill="#53676d">选中子词位置</text><text x="158" y="225" text-anchor="middle" font-size="12" fill="#53676d">预测原 WordPiece ID</text><text x="158" y="264" text-anchor="middle" font-size="12" fill="#53676d">目标：局部 token 恢复</text><rect x="320" y="72" width="260" height="230" rx="15" fill="#fff" stroke="#dce5df"/><text x="450" y="101" text-anchor="middle" font-size="16" font-weight="700" fill="#7461ba">WWM / Span</text><g font-size="12" text-anchor="middle" fill="#203035"><rect x="342" y="128" width="66" height="34" rx="7" fill="#e4e9e5"/><text x="375" y="150">play</text><rect x="414" y="128" width="66" height="34" rx="7" fill="#7461ba"/><text x="447" y="150" fill="#fff">##ing</text><rect x="486" y="128" width="72" height="34" rx="7" fill="#e4e9e5"/><text x="522" y="150">outside</text></g><text x="450" y="202" text-anchor="middle" font-size="13" fill="#53676d">整词分组或连续 span</text><text x="450" y="225" text-anchor="middle" font-size="12" fill="#53676d">WWM：全词子词一起选</text><text x="450" y="264" text-anchor="middle" font-size="12" fill="#53676d">SpanBERT：边界表示辅助预测</text><rect x="612" y="72" width="260" height="230" rx="15" fill="#fff" stroke="#dce5df"/><text x="742" y="101" text-anchor="middle" font-size="16" font-weight="700" fill="#c96c4c">NSP / SOP</text><rect x="634" y="128" width="95" height="42" rx="8" fill="#e2f0eb" stroke="#147f80"/><text x="681" y="154" text-anchor="middle" font-size="13" fill="#203035">A → B</text><rect x="754" y="128" width="95" height="42" rx="8" fill="#fbede7" stroke="#c96c4c"/><text x="801" y="154" text-anchor="middle" font-size="13" fill="#203035">B → A</text><text x="742" y="202" text-anchor="middle" font-size="13" fill="#53676d">句段关系分类</text><text x="742" y="225" text-anchor="middle" font-size="12" fill="#53676d">NSP：跨位置随机负例</text><text x="742" y="264" text-anchor="middle" font-size="12" fill="#53676d">SOP：同一对片段反序</text></g></svg>