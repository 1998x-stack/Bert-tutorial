<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d"><title id="t">MobileBERT 瓶颈宽度与窄深计算</title><desc id="d">传统BERT的大宽度Transformer block与MobileBERT以512宽输入、128内部窄通道、多个FFN再恢复512的结构对比；下方示意多个瓶颈块重复调用。</desc><rect width="960" height="470" rx="20" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" fill="#203035"><text x="26" y="42" font-size="23" font-weight="700">外层可宽，层内计算可以窄；但计算次数仍需数清</text><rect x="25" y="71" width="400" height="351" rx="15" fill="#fff" stroke="#dce5df"/><text x="45" y="107" font-size="19" font-weight="700">传统宽 Transformer（概念）</text><rect x="64" y="151" width="320" height="140" rx="15" fill="#eeeafa" stroke="#7461ba"/><text x="224" y="205" text-anchor="middle" font-size="24">宽 attention + FFN</text><text x="224" y="245" text-anchor="middle" font-size="17">hidden width = H</text><text x="224" y="354" text-anchor="middle" font-size="14" fill="#53676d">每层宽度、长度决定矩阵乘法成本</text><rect x="448" y="71" width="487" height="351" rx="15" fill="#fff" stroke="#dce5df"/><text x="469" y="107" font-size="19" font-weight="700">MobileBERT Bottleneck（典型配置）</text><rect x="479" y="131" width="420" height="48" rx="11" fill="#e2f0eb"/><text x="689" y="162" text-anchor="middle" font-size="18">输入 [B,T,512]</text><path d="M689 180 V196" stroke="#147f80" stroke-width="3"/><rect x="526" y="198" width="326" height="49" rx="11" fill="#eeeafa"/><text x="689" y="229" text-anchor="middle" font-size="18">投影到瓶颈 [B,T,128]</text><path d="M689 247 V263" stroke="#147f80" stroke-width="3"/><rect x="526" y="265" width="326" height="55" rx="11" fill="#e2f0eb" stroke="#147f80"/><text x="689" y="287" text-anchor="middle" font-size="17">窄 attention + 多个 FFN</text><text x="689" y="307" text-anchor="middle" font-size="13">具体 block 结构按配置</text><path d="M689 320 V337" stroke="#147f80" stroke-width="3"/><rect x="479" y="340" width="420" height="48" rx="11" fill="#eeeafa"/><text x="689" y="370" text-anchor="middle" font-size="18">输出投影 [B,T,512]</text><text x="468" y="445" font-size="14" fill="#53676d">窄而深，不等于把全部FLOPs按 128/512 简单缩放</text></g></svg>