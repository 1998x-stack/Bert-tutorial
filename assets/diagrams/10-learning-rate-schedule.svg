<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">Warmup 与线性学习率衰减</title><desc id="desc">学习率从零线性 warmup 到峰值，再线性衰减到零；下方比较 BERT 10K warmup 和 RoBERTa Base 24K、Large 30K warmup 以及不同总步数。</desc><rect width="900" height="370" rx="20" fill="#f5f7f2"/><g font-family="system-ui,sans-serif"><text x="32" y="42" fill="#203035" font-size="20" font-weight="700">Learning rate is a schedule, not a constant</text><path d="M90 80 V240 H820" stroke="#80938d" stroke-width="2" fill="none"/><text x="46" y="90" fill="#53676d" font-size="12">LR</text><text x="822" y="260" fill="#53676d" font-size="12">step</text><path d="M90 240 L210 105 L820 240" stroke="#147f80" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 105 V240" stroke="#c96c4c" stroke-width="2" stroke-dasharray="5 5"/><path d="M820 240 V80" stroke="#dce5df" stroke-width="1"/><text x="150" y="132" fill="#147f80" font-size="13" font-weight="700">Warmup</text><text x="450" y="146" fill="#147f80" font-size="13" font-weight="700">Linear decay</text><text x="210" y="258" text-anchor="middle" fill="#c96c4c" font-size="11">warmup end</text><text x="820" y="278" text-anchor="end" fill="#53676d" font-size="11">total steps</text><rect x="60" y="292" width="780" height="56" rx="12" fill="#fff" stroke="#dce5df"/><text x="84" y="316" fill="#203035" font-size="13" font-weight="700">BERT</text><text x="84" y="336" fill="#53676d" font-size="11">10K warmup / 1M steps</text><text x="360" y="316" fill="#203035" font-size="13" font-weight="700">RoBERTa-Base</text><text x="360" y="336" fill="#53676d" font-size="11">24K warmup / 500K steps / peak 6e-4</text><text x="630" y="316" fill="#203035" font-size="13" font-weight="700">RoBERTa-Large</text><text x="630" y="336" fill="#53676d" font-size="11">30K warmup / 500K / 4e-4</text></g></svg>