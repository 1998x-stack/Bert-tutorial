<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc"><title id="title">BERT 微调的可复现训练流水线</title><desc id="desc">原始记录先定义字段并切分 train validation test，再 tokenizer 编码，动态 padding collator，预训练 Encoder 加任务头训练，最后验证集选模型和测试集最终评估。</desc><rect width="900" height="340" rx="20" fill="#f5f7f2"/><g font-family="system-ui,sans-serif"><text x="32" y="42" fill="#203035" font-size="20" font-weight="700">先固定数据契约，再让模型进入训练循环</text><rect x="28" y="90" width="132" height="94" rx="13" fill="#fff" stroke="#9aaba6" stroke-width="2"/><text x="94" y="122" text-anchor="middle" fill="#203035" font-size="15" font-weight="700">Raw records</text><text x="94" y="148" text-anchor="middle" fill="#53676d" font-size="12">text / label</text><path d="M160 137 H182" stroke="#147f80" stroke-width="3"/><path d="M174 129 L186 137 L174 145" fill="none" stroke="#147f80" stroke-width="3"/><rect x="190" y="90" width="132" height="94" rx="13" fill="#e2f0eb" stroke="#147f80" stroke-width="2"/><text x="256" y="122" text-anchor="middle" fill="#203035" font-size="15" font-weight="700">Split</text><text x="256" y="148" text-anchor="middle" fill="#53676d" font-size="12">train / dev / test</text><path d="M322 137 H344" stroke="#147f80" stroke-width="3"/><path d="M336 129 L348 137 L336 145" fill="none" stroke="#147f80" stroke-width="3"/><rect x="352" y="90" width="132" height="94" rx="13" fill="#eeeafa" stroke="#7461ba" stroke-width="2"/><text x="418" y="122" text-anchor="middle" fill="#203035" font-size="15" font-weight="700">Tokenizer</text><text x="418" y="148" text-anchor="middle" fill="#53676d" font-size="12">IDs / masks</text><path d="M484 137 H506" stroke="#147f80" stroke-width="3"/><path d="M498 129 L510 137 L498 145" fill="none" stroke="#147f80" stroke-width="3"/><rect x="514" y="90" width="132" height="94" rx="13" fill="#fbede7" stroke="#c96c4c" stroke-width="2"/><text x="580" y="122" text-anchor="middle" fill="#203035" font-size="15" font-weight="700">Collator</text><text x="580" y="148" text-anchor="middle" fill="#53676d" font-size="12">pad / batch</text><path d="M646 137 H668" stroke="#147f80" stroke-width="3"/><path d="M660 129 L672 137 L660 145" fill="none" stroke="#147f80" stroke-width="3"/><rect x="676" y="90" width="196" height="94" rx="13" fill="#203035"/><text x="774" y="122" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Encoder + Head</text><text x="774" y="148" text-anchor="middle" fill="#dce8e3" font-size="12">loss / optimizer</text><path d="M774 184 V222 H452" fill="none" stroke="#9aaba6" stroke-width="2"/><rect x="300" y="222" width="304" height="64" rx="12" fill="#d7eee7" stroke="#147f80" stroke-width="2"/><text x="452" y="248" text-anchor="middle" fill="#203035" font-size="15" font-weight="700">Validation → checkpoint selection</text><text x="452" y="270" text-anchor="middle" fill="#53676d" font-size="12">tune LR / epoch / threshold here</text><path d="M604 254 H690" stroke="#147f80" stroke-width="3"/><path d="M682 246 L694 254 L682 262" fill="none" stroke="#147f80" stroke-width="3"/><rect x="700" y="222" width="172" height="64" rx="12" fill="#fff" stroke="#c96c4c" stroke-width="2"/><text x="786" y="248" text-anchor="middle" fill="#203035" font-size="15" font-weight="700">Test once</text><text x="786" y="270" text-anchor="middle" fill="#53676d" font-size="12">final report</text><text x="450" y="322" text-anchor="middle" fill="#53676d" font-size="12">test split must not feed back into model or hyperparameter selection</text></g></svg>