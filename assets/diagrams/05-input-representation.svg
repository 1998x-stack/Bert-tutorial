<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">BERT 输入序列与三类嵌入相加</title>
<desc id="desc">句对被编码为 CLS、A、SEP、B、SEP，每个 token 对应 token、segment、position 三种同维向量，逐元素相加形成输入表示。</desc>
<rect width="900" height="390" rx="20" fill="#f5f7f2"/>
<g font-family="system-ui,sans-serif">
<text x="34" y="42" fill="#203035" font-size="20" font-weight="700">句对先变成一条带边界标记的 token 序列</text>
<g text-anchor="middle" font-size="14" fill="#203035">
<rect x="36" y="70" width="118" height="44" rx="9" fill="#203035"/><text x="95" y="98" fill="#fff" font-weight="700">[CLS]</text>
<rect x="164" y="70" width="118" height="44" rx="9" fill="#e2f0eb" stroke="#147f80"/><text x="223" y="98">A₁</text>
<rect x="292" y="70" width="118" height="44" rx="9" fill="#e2f0eb" stroke="#147f80"/><text x="351" y="98">A₂</text>
<rect x="420" y="70" width="118" height="44" rx="9" fill="#eeeafa" stroke="#7461ba"/><text x="479" y="98">[SEP]</text>
<rect x="548" y="70" width="118" height="44" rx="9" fill="#fbede7" stroke="#c96c4c"/><text x="607" y="98">B₁</text>
<rect x="676" y="70" width="118" height="44" rx="9" fill="#eeeafa" stroke="#7461ba"/><text x="735" y="98">[SEP]</text>
</g>
<text x="286" y="139" text-anchor="middle" fill="#147f80" font-size="12">Segment A · token_type_id = 0</text><text x="642" y="139" text-anchor="middle" fill="#c96c4c" font-size="12">Segment B · token_type_id = 1</text>
<path d="M450 150 V178" stroke="#9aaba6" stroke-width="2"/><path d="M442 170 L450 182 L458 170" fill="none" stroke="#9aaba6" stroke-width="2"/>
<rect x="38" y="188" width="240" height="62" rx="12" fill="#e2f0eb" stroke="#147f80" stroke-width="2"/><text x="158" y="215" text-anchor="middle" fill="#203035" font-size="16" font-weight="700">Token Embedding</text><text x="158" y="236" text-anchor="middle" fill="#53676d" font-size="12">词表索引 → 向量</text>
<rect x="330" y="188" width="240" height="62" rx="12" fill="#eeeafa" stroke="#7461ba" stroke-width="2"/><text x="450" y="215" text-anchor="middle" fill="#203035" font-size="16" font-weight="700">Segment Embedding</text><text x="450" y="236" text-anchor="middle" fill="#53676d" font-size="12">句段 A / B</text>
<rect x="622" y="188" width="240" height="62" rx="12" fill="#fbede7" stroke="#c96c4c" stroke-width="2"/><text x="742" y="215" text-anchor="middle" fill="#203035" font-size="16" font-weight="700">Position Embedding</text><text x="742" y="236" text-anchor="middle" fill="#53676d" font-size="12">绝对位置索引</text>
<path d="M158 250 V278 H450 M450 250 V278 M742 250 V278 H450 V296" fill="none" stroke="#9aaba6" stroke-width="2"/>
<circle cx="450" cy="300" r="20" fill="#203035"/><text x="450" y="307" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">+</text>
<path d="M450 320 V342" stroke="#147f80" stroke-width="3"/><path d="M442 334 L450 346 L458 334" fill="none" stroke="#147f80" stroke-width="3"/>
<rect x="280" y="348" width="340" height="32" rx="9" fill="#d7eee7" stroke="#147f80"/><text x="450" y="370" text-anchor="middle" fill="#203035" font-size="14" font-weight="700">LayerNorm + Dropout → Encoder</text>
</g>
</svg>