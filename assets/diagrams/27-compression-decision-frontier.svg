<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">压缩策略的统一验收流水线</title><desc id="desc">从同一 FP32 基线分别试验 INT8、蒸馏、结构/非结构剪枝，各自流向同一质量、p95 延迟和峰值内存验收门。只有通过任务质量门槛与设备预算的候选能够发布，未过门槛则回退。</desc><rect width="960" height="460" rx="22" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="37" font-size="22" fill="#203035" font-weight="700">模型变小，不代表系统变好：统一比较才有答案</text><rect x="344" y="78" width="272" height="62" rx="14" fill="#203035"/><text x="480" y="104" fill="#ffffff" font-size="17" font-weight="700">固定 FP32 Baseline</text><text x="480" y="125" fill="#d8eae2" font-size="13">任务质量 / p95 / peak RSS</text><rect x="30" y="206" width="204" height="74" rx="15" fill="#e2f1eb" stroke="#168579" stroke-width="2"/><text x="132" y="236" fill="#203035" font-size="16" font-weight="700">INT8 量化</text><text x="132" y="261" fill="#53676d" font-size="13">量化误差/算子</text><path d="M480 140 V175 H132 V205" stroke="#168579" stroke-width="2" fill="none"/><rect x="265" y="206" width="204" height="74" rx="15" fill="#eeeafb" stroke="#7461ba" stroke-width="2"/><text x="367" y="236" fill="#203035" font-size="16" font-weight="700">非结构化剪枝</text><text x="367" y="261" fill="#53676d" font-size="13">稀疏 kernel</text><path d="M480 140 V175 H367 V205" stroke="#168579" stroke-width="2" fill="none"/><rect x="500" y="206" width="204" height="74" rx="15" fill="#e2f1eb" stroke="#168579" stroke-width="2"/><text x="602" y="236" fill="#203035" font-size="16" font-weight="700">结构化剪枝</text><text x="602" y="261" fill="#53676d" font-size="13">形状/残差一致</text><path d="M480 140 V175 H602 V205" stroke="#168579" stroke-width="2" fill="none"/><rect x="735" y="206" width="204" height="74" rx="15" fill="#eeeafb" stroke="#7461ba" stroke-width="2"/><text x="837" y="236" fill="#203035" font-size="16" font-weight="700">蒸馏 Student</text><text x="837" y="261" fill="#53676d" font-size="13">Teacher/Student</text><path d="M480 140 V175 H837 V205" stroke="#168579" stroke-width="2" fill="none"/><rect x="206" y="334" width="548" height="72" rx="16" fill="#fff0df" stroke="#c78546" stroke-width="2"/><text x="480" y="363" fill="#9d5b31" font-size="18" font-weight="700">共同验收：任务 F1/Accuracy + p95 + peak RSS</text><text x="480" y="387" fill="#53676d" font-size="14">通过预算才发布 · 失败回退 FP32</text><path d="M480 280 V334" stroke="#168579" stroke-width="3"/><text x="480" y="441" fill="#53676d" font-size="14">各分支需在相同设备、长度分布、模型输出协议下测量</text></g></svg>