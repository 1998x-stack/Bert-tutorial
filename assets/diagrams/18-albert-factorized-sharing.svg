<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">ALBERT 嵌入分解与跨层共享</title><desc id="desc">左侧普通 BERT 用 V×H 权重直接映射词表到 hidden；ALBERT 用 V×E 与 E×H 两级映射。右侧三个逐层的 Transformer 调用共享同一权重 theta，但每层产生新的隐藏状态，执行计算并没有消失。</desc><rect width="960" height="450" rx="22" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="480" y="37" font-size="22" fill="#203035" font-weight="700">参数只存一份 ≠ 计算只执行一次</text><text x="252" y="80" font-size="17" fill="#203035" font-weight="700">① 分解词表 Embedding</text><text x="720" y="80" font-size="17" fill="#203035" font-weight="700">② Transformer 跨层共享</text><rect x="31" y="116" width="194" height="78" rx="15" fill="#fce9e0" stroke="#c77d5c" stroke-width="2"/><text x="128" y="147" font-size="18" font-weight="700" fill="#984b2d">BERT</text><text x="128" y="173" font-size="14" fill="#984b2d">V × H 大矩阵</text><rect x="278" y="116" width="176" height="78" rx="15" fill="#e2f1e9" stroke="#198071" stroke-width="2"/><text x="366" y="147" font-size="18" font-weight="700" fill="#145b50">ALBERT</text><text x="366" y="173" font-size="14" fill="#145b50">V × E + E × H</text><text x="240" y="234" font-size="15" fill="#53676d">V=30,000 · H=768 · E=128</text><text x="128" y="270" font-size="18" fill="#984b2d">23,040,000</text><text x="366" y="270" font-size="18" fill="#145b50">3,938,304</text><text x="245" y="300" font-size="14" fill="#53676d">只统计词表嵌入/投影权重</text>
<rect x="534" y="116" width="372" height="62" rx="13" fill="#e1f0ea" stroke="#148578" stroke-width="2"/><text x="720" y="139" font-size="16" fill="#175a54" font-weight="700">Layer 1：h¹ = Fθ(h⁰)</text><text x="720" y="160" font-size="13" fill="#175a54">同一个 θ</text><rect x="534" y="200" width="372" height="62" rx="13" fill="#e1f0ea" stroke="#148578" stroke-width="2"/><text x="720" y="223" font-size="16" fill="#175a54" font-weight="700">Layer 2：h² = Fθ(h¹)</text><text x="720" y="244" font-size="13" fill="#175a54">同一个 θ · 不同 h¹</text><rect x="534" y="284" width="372" height="62" rx="13" fill="#e1f0ea" stroke="#148578" stroke-width="2"/><text x="720" y="307" font-size="16" fill="#175a54" font-weight="700">… Layer 12：h¹² = Fθ(h¹¹)</text><text x="720" y="328" font-size="13" fill="#175a54">仍执行注意力与 FFN</text><path d="M720 178 V200 M720 262 V284" stroke="#148578" stroke-width="3"/><text x="480" y="400" font-size="15" fill="#53676d">模型参数减少主要来自共享存储；每层状态、激活和矩阵乘法仍然需要处理</text></g></svg>