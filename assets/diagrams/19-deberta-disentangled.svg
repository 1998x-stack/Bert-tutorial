<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 453" role="img" aria-labelledby="d-t d-d"><title id="d-t">DeBERTa 三项相对注意力得分示意</title><desc id="d-d">i 的 content query 与 j 的 content key 形成 c2c；i 的 content query 与 i 到 j 的相对位置 key 构成 c2p；相反方向位置 query 与 j 的 content key 构成 p2c。三项相加产生 score，经 softmax 后对 values 加权。</desc><rect width="960" height="453" rx="20" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" fill="#203035"><text x="28" y="42" font-size="23" font-weight="700">查询 i → 候选 j：让三种关系分别说话</text><text x="28" y="72" font-size="14" fill="#53676d">每条通道都输出一个标量，最后汇总为同一个 attention score</text><rect x="24" y="101" width="292" height="193" rx="16" fill="#dce8e3" stroke="#147f80"/><text x="170" y="137" text-anchor="middle" font-size="19" font-weight="700">c2c · 内容 → 内容</text><rect x="47" y="167" width="100" height="62" rx="10" fill="#fff"/><text x="97" y="202" text-anchor="middle" font-size="17">qᶜᵢ</text><text x="160" y="203" font-size="20">·</text><rect x="184" y="167" width="100" height="62" rx="10" fill="#fff"/><text x="234" y="202" text-anchor="middle" font-size="17">kᶜⱼ</text><text x="170" y="269" text-anchor="middle" font-size="14">词内容之间是否匹配</text><rect x="334" y="101" width="292" height="193" rx="16" fill="#eeeafa" stroke="#7461ba"/><text x="480" y="137" text-anchor="middle" font-size="19" font-weight="700">c2p · 内容 → 位置</text><rect x="356" y="167" width="101" height="62" rx="10" fill="#fff"/><text x="406" y="202" text-anchor="middle" font-size="17">qᶜᵢ</text><text x="470" y="203" font-size="20">·</text><rect x="494" y="167" width="109" height="62" rx="10" fill="#fff"/><text x="548" y="202" text-anchor="middle" font-size="16">kᵖ(i→j)</text><text x="480" y="269" text-anchor="middle" font-size="14">查询词偏好哪种相对距离</text><rect x="643" y="101" width="292" height="193" rx="16" fill="#fbe6d4" stroke="#cc8b58"/><text x="789" y="137" text-anchor="middle" font-size="19" font-weight="700">p2c · 位置 → 内容</text><rect x="667" y="167" width="111" height="62" rx="10" fill="#fff"/><text x="722" y="202" text-anchor="middle" font-size="16">qᵖ(j→i)</text><text x="790" y="203" font-size="20">·</text><rect x="817" y="167" width="93" height="62" rx="10" fill="#fff"/><text x="863" y="202" text-anchor="middle" font-size="17">kᶜⱼ</text><text x="789" y="269" text-anchor="middle" font-size="14">候选词内容与反向距离关系</text><path d="M170 295 V332 H480 M480 295 V355 M789 295 V332 H480" stroke="#147f80" stroke-width="3" fill="none"/><rect x="213" y="353" width="534" height="72" rx="13" fill="#203035"/><text x="480" y="381" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Sᵢⱼ = c2c + c2p + p2c</text><text x="480" y="405" text-anchor="middle" fill="#dce8e3" font-size="14">缩放 + attention mask → softmax(key 轴) → 加权 V</text></g></svg>