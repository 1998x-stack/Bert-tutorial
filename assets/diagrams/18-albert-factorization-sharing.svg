<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="a-t a-d"><title id="a-t">ALBERT 的词嵌入因式分解与重复层权重共享</title><desc id="a-d">上方一块大 V 乘 H embedding 拆成 V 乘 E 与 E 乘 H 两块；下方三次 Transformer 计算共用一套 W；右侧 SOP 以 A B 为正样本、B A 为负样本。</desc><rect width="960" height="460" rx="20" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" fill="#203035"><text x="26" y="43" font-size="22" font-weight="700">ALBERT：把独立参数和重复计算分开看</text><rect x="26" y="72" width="282" height="139" rx="16" fill="#fbe6d4" stroke="#cc8b58"/><text x="167" y="111" text-anchor="middle" font-size="18" font-weight="700">BERT embedding</text><text x="167" y="157" text-anchor="middle" font-size="22">V × H</text><text x="167" y="184" text-anchor="middle" font-size="13">30,000 × 768</text><path d="M321 138 H364" stroke="#147f80" stroke-width="4"/><path d="M351 130 L364 138 L351 146" fill="none" stroke="#147f80" stroke-width="4"/><rect x="378" y="72" width="275" height="139" rx="16" fill="#e2f0eb" stroke="#147f80"/><text x="515" y="106" text-anchor="middle" font-size="18" font-weight="700">ALBERT factorization</text><text x="515" y="146" text-anchor="middle" font-size="21">V × E  +  E × H</text><text x="515" y="177" text-anchor="middle" font-size="13">30,000×128 + 128×768</text><rect x="677" y="72" width="259" height="139" rx="16" fill="#fff" stroke="#dce5df"/><text x="806" y="111" text-anchor="middle" font-size="18" font-weight="700">Embedding 权重</text><text x="806" y="151" text-anchor="middle" font-size="22" fill="#147f80">约减少 82.9%</text><text x="806" y="180" text-anchor="middle" font-size="13">仅统计这一部分</text><rect x="26" y="236" width="578" height="190" rx="16" fill="#203035"/><text x="49" y="268" font-size="18" fill="#fff" font-weight="700">跨层共享：h⁰ → fW → h¹ → fW → h² → fW → h³</text><rect x="57" y="295" width="144" height="81" rx="13" fill="#dce8e3"/><rect x="244" y="295" width="144" height="81" rx="13" fill="#dce8e3"/><rect x="430" y="295" width="144" height="81" rx="13" fill="#dce8e3"/><text x="129" y="332" text-anchor="middle" font-size="18">f(W)</text><text x="316" y="332" text-anchor="middle" font-size="18">f(W)</text><text x="502" y="332" text-anchor="middle" font-size="18">f(W)</text><text x="315" y="402" text-anchor="middle" font-size="14" fill="#dce8e3">一套 W · 仍执行三次计算</text><rect x="626" y="236" width="310" height="190" rx="16" fill="#eeeafa" stroke="#7461ba"/><text x="648" y="269" font-size="17" font-weight="700">SOP · 相邻片段顺序</text><rect x="648" y="288" width="261" height="45" rx="10" fill="#fff"/><text x="778" y="315" text-anchor="middle" font-size="17">A → B · 正序</text><rect x="648" y="345" width="261" height="45" rx="10" fill="#fff"/><text x="778" y="372" text-anchor="middle" font-size="17">B → A · 倒序</text></g></svg>