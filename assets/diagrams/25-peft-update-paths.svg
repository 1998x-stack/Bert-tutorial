<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 465" role="img" aria-labelledby="t d"><title id="t">LoRA AdaLoRA BitFit三个参数更新路径</title><desc id="d">左侧冻结预训练大矩阵W0，仅训练低秩A与B；中间AdaLoRA使用P Lambda Q分解并按重要性分配rank；右侧BitFit冻结W权重，只优化bias和任务head。</desc><rect width="960" height="465" rx="20" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" fill="#203035"><text x="26" y="43" font-size="23" font-weight="700">同一层 y = Wx + b，三种可训练子空间</text><rect x="26" y="72" width="288" height="355" rx="15" fill="#fff" stroke="#dce5df"/><text x="170" y="108" font-size="22" text-anchor="middle" font-weight="700">LoRA</text><rect x="57" y="138" width="225" height="70" rx="12" fill="#dce5df"/><text x="169" y="181" text-anchor="middle" font-size="18">W₀（冻结）</text><text x="170" y="248" text-anchor="middle" font-size="24">＋</text><rect x="48" y="269" width="111" height="65" rx="11" fill="#e2f0eb"/><text x="104" y="307" text-anchor="middle" font-size="19">B · A</text><text x="222" y="300" text-anchor="middle" font-size="15" fill="#147f80">train</text><text x="170" y="392" text-anchor="middle" font-size="14" fill="#53676d">固定低秩 r</text><rect x="335" y="72" width="288" height="355" rx="15" fill="#fff" stroke="#dce5df"/><text x="479" y="108" font-size="22" text-anchor="middle" font-weight="700">AdaLoRA</text><rect x="366" y="138" width="225" height="70" rx="12" fill="#dce5df"/><text x="478" y="181" text-anchor="middle" font-size="18">W₀（冻结）</text><text x="479" y="248" text-anchor="middle" font-size="24">＋</text><rect x="355" y="269" width="248" height="65" rx="11" fill="#eeeafa"/><text x="479" y="308" text-anchor="middle" font-size="19">P · Λ · Q</text><text x="479" y="392" text-anchor="middle" font-size="14" fill="#53676d">重要性驱动 rank 预算</text><rect x="644" y="72" width="288" height="355" rx="15" fill="#fff" stroke="#dce5df"/><text x="788" y="108" font-size="22" text-anchor="middle" font-weight="700">BitFit</text><rect x="675" y="138" width="225" height="70" rx="12" fill="#dce5df"/><text x="787" y="181" text-anchor="middle" font-size="18">W（冻结）</text><rect x="675" y="259" width="225" height="74" rx="12" fill="#e2f0eb"/><text x="787" y="303" text-anchor="middle" font-size="19">b（可训练）</text><text x="788" y="392" text-anchor="middle" font-size="14" fill="#53676d">+ 新任务 head</text><text x="30" y="454" font-size="12" fill="#53676d">浅灰=冻结 · 绿/紫=可训练更新；并不代表训练中基础矩阵没有梯度计算路径</text></g></svg>