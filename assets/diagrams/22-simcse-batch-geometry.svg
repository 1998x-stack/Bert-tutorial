<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">SimCSE 的两次随机视图和对比相似度矩阵</title><desc id="desc">三个句子分别通过同一 Encoder 的两种 dropout mask 得到 anchor 向量与 candidate 向量。相似度三乘三矩阵中对角线是同一句的正例，其它格为 batch 内负例，按每行候选 softmax。</desc><rect width="960" height="440" rx="22" fill="#f5f7f2"/><g font-family="system-ui,sans-serif"><text x="480" y="43" font-size="21" text-anchor="middle" fill="#203035" font-weight="700">同一句双视图 → N × N 对比矩阵</text><text x="480" y="69" font-size="14" text-anchor="middle" fill="#53676d">两次 dropout 共享 Encoder 权重，不共享随机 mask</text><rect x="34" y="109" width="115" height="53" rx="12" fill="#e1f0e9" stroke="#168579"/><text x="91" y="140" text-anchor="middle" font-size="16" fill="#175b55">句 A</text><rect x="211" y="109" width="115" height="53" rx="12" fill="#eeeafb" stroke="#7461ba"/><text x="268" y="140" text-anchor="middle" font-size="15" fill="#614c94">View 1</text><rect x="360" y="109" width="115" height="53" rx="12" fill="#fff0df" stroke="#c98745"/><text x="417" y="140" text-anchor="middle" font-size="15" fill="#94562f">View 2</text><path d="M149 135 H210 M326 135 H359" stroke="#168579" stroke-width="2"/><rect x="34" y="186" width="115" height="53" rx="12" fill="#e1f0e9" stroke="#168579"/><text x="91" y="217" text-anchor="middle" font-size="16" fill="#175b55">句 B</text><rect x="211" y="186" width="115" height="53" rx="12" fill="#eeeafb" stroke="#7461ba"/><text x="268" y="217" text-anchor="middle" font-size="15" fill="#614c94">View 1</text><rect x="360" y="186" width="115" height="53" rx="12" fill="#fff0df" stroke="#c98745"/><text x="417" y="217" text-anchor="middle" font-size="15" fill="#94562f">View 2</text><path d="M149 212 H210 M326 212 H359" stroke="#168579" stroke-width="2"/><rect x="34" y="263" width="115" height="53" rx="12" fill="#e1f0e9" stroke="#168579"/><text x="91" y="294" text-anchor="middle" font-size="16" fill="#175b55">句 C</text><rect x="211" y="263" width="115" height="53" rx="12" fill="#eeeafb" stroke="#7461ba"/><text x="268" y="294" text-anchor="middle" font-size="15" fill="#614c94">View 1</text><rect x="360" y="263" width="115" height="53" rx="12" fill="#fff0df" stroke="#c98745"/><text x="417" y="294" text-anchor="middle" font-size="15" fill="#94562f">View 2</text><path d="M149 289 H210 M326 289 H359" stroke="#168579" stroke-width="2"/><text x="706" y="107" font-size="15" fill="#53676d">Anchor × Candidate</text><rect x="601" y="133" width="71" height="64" rx="10" fill="#177c75"/><text x="636" y="172" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">正例</text><rect x="683" y="133" width="71" height="64" rx="10" fill="#ebe7f5"/><text x="718" y="172" text-anchor="middle" fill="#66528d" font-size="18" font-weight="700">负例</text><rect x="765" y="133" width="71" height="64" rx="10" fill="#ebe7f5"/><text x="800" y="172" text-anchor="middle" fill="#66528d" font-size="18" font-weight="700">负例</text><rect x="601" y="208" width="71" height="64" rx="10" fill="#ebe7f5"/><text x="636" y="247" text-anchor="middle" fill="#66528d" font-size="18" font-weight="700">负例</text><rect x="683" y="208" width="71" height="64" rx="10" fill="#177c75"/><text x="718" y="247" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">正例</text><rect x="765" y="208" width="71" height="64" rx="10" fill="#ebe7f5"/><text x="800" y="247" text-anchor="middle" fill="#66528d" font-size="18" font-weight="700">负例</text><rect x="601" y="283" width="71" height="64" rx="10" fill="#ebe7f5"/><text x="636" y="322" text-anchor="middle" fill="#66528d" font-size="18" font-weight="700">负例</text><rect x="683" y="283" width="71" height="64" rx="10" fill="#ebe7f5"/><text x="718" y="322" text-anchor="middle" fill="#66528d" font-size="18" font-weight="700">负例</text><rect x="765" y="283" width="71" height="64" rx="10" fill="#177c75"/><text x="800" y="322" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">正例</text><text x="480" y="405" font-size="15" fill="#53676d" text-anchor="middle">每一行按候选列 softmax：对角正例概率应相对其它候选更高</text></g></svg>