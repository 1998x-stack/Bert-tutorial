<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">RoBERTa 训练配方的五项改动</title><desc id="desc">RoBERTa 保留 BERT 风格 Encoder 与 MLM，改变动态遮盖、移除 NSP 和输入打包、扩大 batch、增加训练数据与步数、使用 byte-level BPE。</desc><rect width="900" height="360" rx="20" fill="#f5f7f2"/><g font-family="system-ui,sans-serif"><text x="32" y="42" fill="#203035" font-size="20" font-weight="700">RoBERTa：同一类 Encoder，重新设计训练配方</text><rect x="330" y="74" width="240" height="54" rx="12" fill="#203035"/><text x="450" y="107" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">BERT-style Encoder + MLM</text><path d="M450 128 V154 M130 154 H770 M130 154 V180 M290 154 V180 M450 154 V180 M610 154 V180 M770 154 V180" fill="none" stroke="#9aaba6" stroke-width="2"/><g text-anchor="middle" font-family="system-ui,sans-serif"><rect x="32" y="180" width="196" height="110" rx="12" fill="#e2f0eb" stroke="#147f80" stroke-width="2"/><text x="130" y="211" font-size="15" font-weight="700" fill="#203035">Dynamic Mask</text><text x="130" y="238" font-size="12" fill="#53676d">每次呈现重新采样</text><text x="130" y="259" font-size="12" fill="#53676d">减少固定模式重复</text><rect x="192" y="180" width="196" height="110" rx="12" fill="#eeeafa" stroke="#7461ba" stroke-width="2"/><text x="290" y="211" font-size="15" font-weight="700" fill="#203035">No NSP</text><text x="290" y="238" font-size="12" fill="#53676d">FULL / DOC sentences</text><text x="290" y="259" font-size="12" fill="#53676d">更长连续上下文</text><rect x="352" y="180" width="196" height="110" rx="12" fill="#fbede7" stroke="#c96c4c" stroke-width="2"/><text x="450" y="211" font-size="15" font-weight="700" fill="#203035">Large Batch</text><text x="450" y="238" font-size="12" fill="#53676d">8K sequences</text><text x="450" y="259" font-size="12" fill="#53676d">同步调整 LR 与步数</text><rect x="512" y="180" width="196" height="110" rx="12" fill="#e2f0eb" stroke="#147f80" stroke-width="2"/><text x="610" y="211" font-size="15" font-weight="700" fill="#203035">More Data / Steps</text><text x="610" y="238" font-size="12" fill="#53676d">约 160GB</text><text x="610" y="259" font-size="12" fill="#53676d">最长 500K steps</text><rect x="672" y="180" width="196" height="110" rx="12" fill="#eeeafa" stroke="#7461ba" stroke-width="2"/><text x="770" y="211" font-size="15" font-weight="700" fill="#203035">Byte-level BPE</text><text x="770" y="238" font-size="12" fill="#53676d">约 50K vocab</text><text x="770" y="259" font-size="12" fill="#53676d">替换 WordPiece 方案</text></g><text x="450" y="330" text-anchor="middle" fill="#53676d" font-size="12">论文的最终提升来自组合配方；多项因素同时变化，不能将全部收益归因于某一个开关。</text></g></svg>