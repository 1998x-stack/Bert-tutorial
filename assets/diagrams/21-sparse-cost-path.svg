<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">局部多跳、全局捷径和注意力边数预算</title><desc id="d">左侧0到7需7次相邻跳转，但通过全局CLS两跳；右侧T为512和4096的dense平方边数与固定窗口64加一个global的线性估算。</desc><rect width="960" height="440" rx="18" fill="#f5f7f2"/><g font-family="system-ui,sans-serif"><text x="25" y="42" font-size="23" font-weight="700" fill="#203035">远程依赖的“路”，与长输入的“账”</text><rect x="25" y="71" width="552" height="342" rx="13" fill="#fff" stroke="#dce5df"/><text x="42" y="101" font-size="17" font-weight="700" fill="#203035">局部只有邻居：传播需要多跳</text><rect x="46" y="145" width="44" height="44" rx="9" fill="#eeeafa" stroke="#147f80"/><text x="68" y="173" text-anchor="middle" font-size="16" fill="#203035">0</text><path d="M90 167 H110" stroke="#147f80" stroke-width="2"/><rect x="110" y="145" width="44" height="44" rx="9" fill="#e2f0eb" stroke="#147f80"/><text x="132" y="173" text-anchor="middle" font-size="16" fill="#203035">1</text><path d="M154 167 H174" stroke="#147f80" stroke-width="2"/><rect x="174" y="145" width="44" height="44" rx="9" fill="#e2f0eb" stroke="#147f80"/><text x="196" y="173" text-anchor="middle" font-size="16" fill="#203035">2</text><path d="M218 167 H238" stroke="#147f80" stroke-width="2"/><rect x="238" y="145" width="44" height="44" rx="9" fill="#e2f0eb" stroke="#147f80"/><text x="260" y="173" text-anchor="middle" font-size="16" fill="#203035">3</text><path d="M282 167 H302" stroke="#147f80" stroke-width="2"/><rect x="302" y="145" width="44" height="44" rx="9" fill="#e2f0eb" stroke="#147f80"/><text x="324" y="173" text-anchor="middle" font-size="16" fill="#203035">4</text><path d="M346 167 H366" stroke="#147f80" stroke-width="2"/><rect x="366" y="145" width="44" height="44" rx="9" fill="#e2f0eb" stroke="#147f80"/><text x="388" y="173" text-anchor="middle" font-size="16" fill="#203035">5</text><path d="M410 167 H430" stroke="#147f80" stroke-width="2"/><rect x="430" y="145" width="44" height="44" rx="9" fill="#e2f0eb" stroke="#147f80"/><text x="452" y="173" text-anchor="middle" font-size="16" fill="#203035">6</text><path d="M474 167 H494" stroke="#147f80" stroke-width="2"/><rect x="494" y="145" width="44" height="44" rx="9" fill="#eeeafa" stroke="#147f80"/><text x="516" y="173" text-anchor="middle" font-size="16" fill="#203035">7</text><text x="49" y="221" font-size="14" fill="#53676d">0→1→2→3→4→5→6→7：需要 7 跳</text><rect x="256" y="264" width="80" height="50" rx="12" fill="#7461ba"/><text x="296" y="295" text-anchor="middle" font-size="20" fill="#fff">CLS</text><path d="M68 191 L266 265 M516 191 L325 265" stroke="#7461ba" stroke-width="4" fill="none"/><text x="49" y="349" font-size="14" fill="#53676d">0→CLS→7：两跳可达；信息质量仍靠学习</text><rect x="596" y="71" width="337" height="342" rx="13" fill="#fff" stroke="#dce5df"/><text x="614" y="101" font-size="18" font-weight="700" fill="#203035">边数 ≠ GPU 时间</text><text x="614" y="130" font-size="16" fill="#203035" font-weight="700">T=512</text><rect x="614" y="145" width="265" height="16" rx="5" fill="#7461ba"/><text x="614" y="178" font-size="13" fill="#53676d">Dense: 262,144</text><rect x="614" y="190" width="34" height="16" rx="5" fill="#147f80"/><text x="614" y="224" font-size="13" fill="#53676d">T×65: 33,280</text><text x="614" y="256" font-size="16" fill="#203035" font-weight="700">T=4096</text><rect x="614" y="271" width="265" height="16" rx="5" fill="#7461ba"/><text x="614" y="304" font-size="13" fill="#53676d">Dense: 16,777,216</text><rect x="614" y="316" width="4" height="16" rx="5" fill="#147f80"/><text x="614" y="350" font-size="13" fill="#53676d">T×65: 266,240</text><text x="614" y="393" font-size="12" fill="#53676d">窗口固定64+global1，粗略数量级</text></g></svg>